<svg width="1000" height="534" viewBox="0 0 1000 534" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brushed metal metallic linear gradient -->
    <linearGradient id="metalTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f3f5"/>
      <stop offset="20%" stop-color="#e4e6ea"/>
      <stop offset="40%" stop-color="#f0f2f5"/>
      <stop offset="60%" stop-color="#dcdfe5"/>
      <stop offset="80%" stop-color="#e8ebf0"/>
      <stop offset="100%" stop-color="#d8dce2"/>
    </linearGradient>

    <!-- Clip path to keep slash strictly within the prohibition ring -->
    <clipPath id="circleClip">
      <circle cx="225" cy="262" r="152" />
    </clipPath>
  </defs>

  <!-- 1. Background plate with rounded corners -->
  <rect width="1000" height="534" rx="24" ry="24" fill="url(#metalTexture)" stroke="#1a202c" stroke-width="6"/>

  <!-- 2. Inset border frame -->
  <rect x="18" y="20" width="964" height="494" rx="16" ry="16" fill="none" stroke="#1a202c" stroke-width="4.5"/>

  <!-- ==================== LEFT GRAPHICAL DRAWINGS ==================== -->
  <g id="prohibition-sign">
    
    <!-- 3A. ELEGANT HIGH HEEL STILETTO PUMP (Sleek, sculpted Bezier silhouette) -->
    <path d="M 124 354 
             L 131 354 
             L 133 300 
             C 134 286, 142 284, 148 286 
             C 158 290, 168 325, 185 352 
             C 194 360, 214 361, 230 357 
             C 246 353, 260 348, 265 345 
             C 264 340, 252 334, 240 327 
             C 216 317, 185 310, 175 290 
             C 166 268, 146 235, 128 224 
             C 116 234, 109 250, 110 274 
             C 111 288, 123 296, 124 354 Z" 
          fill="#1a202c" />

    <!-- 3B. CLASSIC OXFORD DRESS SHOE (Refined leather silhouette, stacked heel & laces) -->
    <g transform="translate(268, 208) rotate(42)">
      <!-- Stacked Heel Block -->
      <path d="M -76 18 L -44 18 L -44 38 L -76 38 Z" fill="#1a202c" />
      
      <!-- Outsole with welted curve and toe spring -->
      <path d="M -44 20 
               C -20 22, 10 24, 35 25 
               C 55 26, 75 24, 86 18 
               C 89 22, 85 27, 78 30 
               C 56 36, 28 37, 0 35 
               C -24 33, -38 29, -44 27 Z" 
            fill="#1a202c" />
      
      <!-- Main Upper Body (Quarter, Vamp & Cap Toe) -->
      <path d="M -72 16 
               C -70 -2, -64 -18, -54 -24 
               C -45 -22, -36 -18, -28 -16 
               C -24 -22, -16 -28, -6 -28 
               C 4 -28, 14 -24, 24 -15 
               C 42 -7, 62 4, 78 13 
               C 86 17, 87 19, 84 20 
               C 70 23, 45 24, 20 22 
               C -5 20, -30 18, -48 16 
               C -58 15, -67 15, -72 16 Z" 
            fill="#1a202c" />

      <!-- Collar Opening Contour -->
      <path d="M -54 -22 C -45 -17, -35 -14, -26 -14 C -22 -19, -15 -23, -7 -23" 
            stroke="#f0f2f5" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- 4 Parallel Crisp White Laces -->
      <line x1="-18" y1="-17" x2="-5" y2="-15" stroke="#f0f2f5" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="-15" y1="-10" x2="-2" y2="-8"  stroke="#f0f2f5" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="-12" y1="-3"  x2="1"  y2="-1"  stroke="#f0f2f5" stroke-width="2.8" stroke-linecap="round"/>
      <line x1="-9"  y1="4"   x2="4"  y2="6"   stroke="#f0f2f5" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- 4. Prohibition Circle (Vibrant Traffic Red Ring) -->
    <circle cx="225" cy="262" r="152" fill="none" stroke="#d32027" stroke-width="28"/>

    <!-- 5. Prohibition Diagonal Slash (Clipped to Ring) -->
    <g clip-path="url(#circleClip)">
      <line x1="80" y1="117" x2="370" y2="407" stroke="#d32027" stroke-width="28" stroke-linecap="square"/>
    </g>
  </g>

  <!-- ==================== RIGHT TYPOGRAPHY ==================== -->
  <g id="sign-text" text-anchor="middle">
    <!-- Line 1: VUI LÒNG (Deep Slate Condensed Bold) -->
    <text x="680" y="128" 
          font-family="'Roboto Condensed', 'Arial Narrow', 'Segoe UI', -apple-system, sans-serif" 
          font-size="56" 
          font-weight="800" 
          fill="#1a202c" 
          letter-spacing="3">VUI LÒNG</text>

    <!-- Line 2: ĐỂ GIÀY DÉP (Vibrant Red Heavy Condensed) -->
    <text x="680" y="235" 
          font-family="'Roboto Condensed', 'Arial Narrow', 'Segoe UI', -apple-system, sans-serif" 
          font-size="94" 
          font-weight="900" 
          fill="#d32027" 
          letter-spacing="1.5">ĐỂ GIÀY DÉP</text>

    <!-- Line 3: BÊN NGOÀI (Vibrant Red Heavy Condensed) -->
    <text x="680" y="345" 
          font-family="'Roboto Condensed', 'Arial Narrow', 'Segoe UI', -apple-system, sans-serif" 
          font-size="94" 
          font-weight="900" 
          fill="#d32027" 
          letter-spacing="1.5">BÊN NGOÀI</text>

    <!-- Horizontal Divider Line below 'BÊN NGOÀI' -->
    <line x1="550" y1="388" x2="810" y2="388" stroke="#1a202c" stroke-width="4.5"/>

    <!-- Line 4: PLEASE TAKE OFF YOUR SHOES (Deep Slate Condensed) -->
    <text x="680" y="445" 
          font-family="'Roboto Condensed', 'Arial Narrow', 'Segoe UI', -apple-system, sans-serif" 
          font-size="34" 
          font-weight="800" 
          fill="#1a202c" 
          letter-spacing="1">PLEASE TAKE OFF YOUR SHOES</text>

    <!-- Strikethrough Red Line across English text -->
    <line x1="435" y1="434" x2="925" y2="434" stroke="#d32027" stroke-width="7.5" stroke-linecap="square"/>
  </g>
</svg>
