<svg width="1000" height="534" viewBox="0 0 1000 534" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brushed metal metallic gradient -->
    <linearGradient id="metalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eceef1"/>
      <stop offset="25%" stop-color="#e0e2e6"/>
      <stop offset="50%" stop-color="#eceef1"/>
      <stop offset="75%" stop-color="#dadbe0"/>
      <stop offset="100%" stop-color="#e6e8eb"/>
    </linearGradient>
    
    <!-- Clip path to keep slash strictly within the prohibition ring -->
    <clipPath id="circleClip">
      <circle cx="220" cy="260" r="150" />
    </clipPath>
  </defs>

  <!-- 1. Background metal plate with rounded corners -->
  <rect width="1000" height="534" rx="20" ry="20" fill="url(#metalBg)" stroke="#222834" stroke-width="6"/>

  <!-- 2. Inner border rectangle inset from plate edges -->
  <rect x="18" y="22" width="964" height="490" rx="14" ry="14" fill="none" stroke="#222834" stroke-width="4.5"/>

  <!-- ==================== LEFT GRAPHICAL DRAWINGS ==================== -->
  <g id="prohibition-sign">
    
    <!-- 3A. HIGH HEEL PUMP (Smooth, elegant Bezier vector reconstruction) -->
    <path d="M 128 350 
             L 133 350 
             C 133 310, 135 292, 140 286 
             C 150 284, 162 315, 178 348 
             C 186 356, 206 358, 224 356 
             C 242 353, 254 350, 258 348 
             C 256 342, 246 335, 235 328 
             C 213 320, 184 315, 176 295 
             C 168 274, 148 242, 131 230 
             C 120 238, 114 252, 115 272 
             C 117 282, 128 290, 128 350 Z" 
          fill="#222834" />

    <!-- 3B. DRESS SHOE / OXFORD (Clean, smooth geometric & Bezier vector reconstruction) -->
    <g transform="translate(262, 210) rotate(42)">
      <!-- Heel Block -->
      <path d="M -72 17 L -44 17 L -44 35 L -72 35 Z" fill="#222834" />
      
      <!-- Outsole welt & tread -->
      <path d="M -44 19 
               C -25 21, -5 23, 15 25 
               C 35 27, 58 26, 74 21 
               C 77 24, 75 28, 70 30 
               C 52 35, 28 36, 5 34 
               C -18 32, -35 29, -44 26 Z" 
            fill="#222834" />
      
      <!-- Upper Body -->
      <path d="M -70 15 
               C -68 0, -62 -14, -54 -20 
               C -46 -18, -38 -15, -30 -13 
               C -26 -18, -20 -23, -12 -23 
               C -4 -23, 4 -19, 12 -12 
               C 28 -5, 48 5, 65 14 
               C 73 18, 75 20, 72 21 
               C 58 25, 35 25, 15 23 
               C -5 21, -25 19, -44 17 
               C -55 16, -65 16, -70 15 Z" 
            fill="#222834" />
      
      <!-- Collar Opening Accent -->
      <path d="M -52 -18 C -44 -14, -36 -12, -28 -12 C -24 -16, -18 -19, -12 -19" 
            stroke="#e0e2e6" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Clean White Laces (4 distinct horizontal bars) -->
      <line x1="-22" y1="-14" x2="-10" y2="-12" stroke="#e0e2e6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-19" y1="-8"  x2="-7"  y2="-6"  stroke="#e0e2e6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-16" y1="-2"  x2="-4"  y2="0"   stroke="#e0e2e6" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="-13" y1="4"   x2="-1"  y2="6"   stroke="#e0e2e6" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 4. Prohibition Circle (Red Ring) -->
    <circle cx="220" cy="260" r="150" fill="none" stroke="#d3222a" stroke-width="26"/>

    <!-- 5. Prohibition Diagonal Slash (Top-Left to Bottom-Right) -->
    <g clip-path="url(#circleClip)">
      <line x1="80" y1="120" x2="360" y2="400" stroke="#d3222a" stroke-width="26" stroke-linecap="square"/>
    </g>
  </g>

  <!-- ==================== RIGHT TYPOGRAPHY ==================== -->
  <g id="sign-text" text-anchor="middle">
    <!-- Line 1: VUI LÒNG (Dark Slate Bold Sans-Serif) -->
    <text x="673" y="125" 
          font-family="'Arial Black', 'Arial', 'Impact', 'Segoe UI', 'Roboto Condensed', sans-serif" 
          font-size="62" 
          font-weight="900" 
          fill="#222834" 
          letter-spacing="2">VUI LÒNG</text>

    <!-- Line 2: ĐỂ GIÀY DÉP (Vibrant Red Extra-Bold Condensed) -->
    <text x="673" y="235" 
          font-family="'Arial Black', 'Arial', 'Impact', 'Segoe UI', 'Roboto Condensed', sans-serif" 
          font-size="94" 
          font-weight="900" 
          fill="#d3222a" 
          letter-spacing="1">ĐỂ GIÀY DÉP</text>

    <!-- Line 3: BÊN NGOÀI (Vibrant Red Extra-Bold Condensed) -->
    <text x="673" y="350" 
          font-family="'Arial Black', 'Arial', 'Impact', 'Segoe UI', 'Roboto Condensed', sans-serif" 
          font-size="94" 
          font-weight="900" 
          fill="#d3222a" 
          letter-spacing="1">BÊN NGOÀI</text>

    <!-- Horizontal Divider Line below 'BÊN NGOÀI' -->
    <line x1="540" y1="395" x2="806" y2="395" stroke="#222834" stroke-width="4.5"/>

    <!-- Line 4: PLEASE TAKE OFF YOUR SHOES (Dark Slate Sans-Serif) -->
    <text x="673" y="450" 
          font-family="'Arial Black', 'Arial', 'Segoe UI', 'Roboto', sans-serif" 
          font-size="36" 
          font-weight="800" 
          fill="#222834" 
          letter-spacing="0.5">PLEASE TAKE OFF YOUR SHOES</text>

    <!-- Strikethrough Red Line across English text -->
    <line x1="432" y1="440" x2="934" y2="440" stroke="#d3222a" stroke-width="7.5" stroke-linecap="square"/>
  </g>
</svg>
